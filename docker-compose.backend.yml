services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - coordinator
    restart: unless-stopped

  coordinator-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: precision_mpc
      POSTGRES_USER: precision
      POSTGRES_PASSWORD: precision
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precision -d precision_mpc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coordinator_data:/var/lib/postgresql/data

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      coordinator-db:
        condition: service_healthy
      hospital-a:
        condition: service_healthy
      hospital-b:
        condition: service_healthy
      hospital-c:
        condition: service_healthy
      hospital-d:
        condition: service_healthy
      hospital-e:
        condition: service_healthy
      hospital-f:
        condition: service_healthy
      hospital-g:
        condition: service_healthy
    restart: unless-stopped
    environment:
      COORDINATOR_DATABASE_URL: postgresql+psycopg://precision:precision@coordinator-db:5432/precision_mpc
      COORDINATOR_AUTO_CREATE_SCHEMA: "true"
      COORDINATOR_AUTO_SEED: "true"
      COORDINATOR_JWT_SECRET: precision-mpc-demo-jwt-secret-change-before-production-123456
      COORDINATOR_MPC_SERVICE_TOKEN: precision-mpc-demo-token
      COORDINATOR_THRESHOLD: "1"
      COORDINATOR_MINIMUM_COHORT_SIZE: "10"
      COORDINATOR_CORS_ORIGINS: '["http://localhost:5174"]'
      COORDINATOR_HOSPITAL_PUBLIC_URLS: '{"1":"http://localhost:8101","2":"http://localhost:8102","3":"http://localhost:8103","4":"http://localhost:8104","5":"http://localhost:8105","6":"http://localhost:8106","7":"http://localhost:8107"}'

  hospital-a-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: precision
      POSTGRES_PASSWORD: precision
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precision -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hospital_a_data:/var/lib/postgresql/data
    restart: unless-stopped

  hospital-b-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: precision
      POSTGRES_PASSWORD: precision
